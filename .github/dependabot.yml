version: 2
updates:
  # Avalonia moves fast and the control sits directly on its drawing API,
  # so a bump is worth seeing as a PR that CI has already run the golden
  # check against.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
